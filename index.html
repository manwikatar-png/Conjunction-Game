<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conjunction Match</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2a33;--mut:#6b6877;--line:#e3d9c4;--acc:#ff7a45;--ok:#2e9e5b;--okbg:#dff5e6;--bad:#d64545;--sel:#fff0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b22;--card:#2a2933;--ink:#f3f1f8;--mut:#a9a6b5;--line:#44424f;--acc:#ff9466;--ok:#5fd18a;--okbg:#1f3a2b;--bad:#ff7a7a;--sel:#4a3a28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1b22;--card:#2a2933;--ink:#f3f1f8;--mut:#a9a6b5;--line:#44424f;--acc:#ff9466;--ok:#5fd18a;--okbg:#1f3a2b;--bad:#ff7a7a;--sel:#4a3a28;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI","Noto Sans Thai",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{margin:4px 0;font-size:26px}
.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.prog{height:10px;background:var(--line);border-radius:9px;overflow:hidden;flex:1;margin:0 12px}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.col h2{font-size:13px;color:var(--mut);margin:0;text-transform:uppercase;letter-spacing:.06em}
button.c{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:center;min-height:68px}
button.pic .em{font-size:30px;line-height:1.2}
button.pic .s{font-size:13px;color:var(--mut);margin-top:2px}
button.w{font-size:20px;font-weight:800;color:var(--acc)}
button.c.sel{background:var(--sel);border-color:var(--acc)}
button.c.done{background:var(--okbg);border-color:var(--ok);cursor:default}
button.c.done.w{color:var(--ok)}
button.c.shake{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.th{display:block;font-size:12px;font-weight:600;color:var(--mut)}
#end{display:none;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
#end .big{font-size:48px}
.btn{font:inherit;font-weight:800;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 20px;cursor:pointer;margin-top:8px}
@media(max-width:420px){button.w{font-size:17px}button.pic .s{font-size:12px}}
</style></head>
<body><main>
<h1>🔗 Conjunction Match</h1>
<p class="sub">Tap a picture, then tap the conjunction that fits the blank. · แตะรูป แล้วแตะคำเชื่อมที่ใช่</p>
<div class="bar"><span id="sc">0/10</span><div class="prog"><i id="pg"></i></div><span id="mv">Tries: 0</span></div>
<div class="cols">
<div class="col"><h2>Pictures</h2><div class="col" id="L"></div></div>
<div class="col"><h2>Words</h2><div class="col" id="R"></div></div>
</div>
<div id="end"><div class="big">🎉</div><h2 id="et">Great job!</h2><p id="ep" class="sub"></p><button class="btn" id="re">Play again</button></div>
</main>
<script>
var D=[
["and","🍎 + 🍌","I like apples ___ bananas.","และ"],
["but","😴 ✖ 🛏️","I am tired ___ I can’t sleep.","แต่"],
["or","🍵 ❓ ☕","Do you want tea ___ coffee?","หรือ"],
["because","🤒 ➜ 🏠","I stay home ___ I am sick.","เพราะว่า"],
["so","🌧️ ➜ ☂️","It is raining, ___ I take an umbrella.","ดังนั้น"],
["although","🥵 🧥","___ it is hot, he wears a coat.","แม้ว่า"],
["when","🔔 🏫","I go to class ___ the bell rings.","เมื่อ"],
["if","🌧️ ⚽✖","___ it rains, we won’t play football.","ถ้า"],
["before","🪥 ➜ 🛏️","I brush my teeth ___ I go to bed.","ก่อนที่"],
["after","🍽️ ➜ 📚","I do homework ___ I eat dinner.","หลังจากที่"]
];
var sel=null,ok=0,tries=0;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){
 sel=null;ok=0;tries=0;upd();
 document.getElementById("end").style.display="none";
 var L=document.getElementById("L"),R=document.getElementById("R");L.innerHTML="";R.innerHTML="";
 sh(D).forEach(function(d){var b=document.createElement("button");b.className="c pic";b.dataset.k=d[0];
  b.innerHTML='<div class="em">'+d[1]+'</div><div class="s">'+d[2]+'</div>';b.onclick=function(){pick(b,"pic")};L.appendChild(b)});
 sh(D).forEach(function(d){var b=document.createElement("button");b.className="c w";b.dataset.k=d[0];
  b.innerHTML=d[0]+'<span class="th"></span>';b.dataset.th=d[3];b.onclick=function(){pick(b,"w")};R.appendChild(b)});
}
function pick(b,t){
 if(b.classList.contains("done"))return;
 if(!sel||sel.t===t){if(sel)sel.b.classList.remove("sel");sel={b:b,t:t};b.classList.add("sel");return}
 var a=sel.b,c=b;sel.b.classList.remove("sel");sel=null;tries++;
 if(a.dataset.k===c.dataset.k){
  [a,c].forEach(function(x){x.classList.add("done")});
  var w=a.classList.contains("w")?a:c,p=a.classList.contains("w")?c:a;
  w.querySelector(".th").textContent=w.dataset.th;
  p.querySelector(".s").textContent=p.querySelector(".s").textContent.replace("___",w.dataset.k.toUpperCase());
  ok++;
 }else{[a,c].forEach(function(x){x.classList.add("shake");setTimeout(function(){x.classList.remove("shake")},400)})}
 upd();
 if(ok===10){var e=document.getElementById("end");e.style.display="block";
  document.getElementById("ep").textContent="You matched all 10 in "+tries+" tries. "+(tries<=12?"Amazing! ⭐⭐⭐":tries<=16?"Nice! ⭐⭐":"Keep practicing! ⭐");
  e.scrollIntoView({behavior:"smooth"})}
}
function upd(){document.getElementById("sc").textContent=ok+"/10";document.getElementById("pg").style.width=ok*10+"%";document.getElementById("mv").textContent="Tries: "+tries}
document.getElementById("re").onclick=start;
start();
</script></body></html>
